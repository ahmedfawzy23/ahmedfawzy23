<svg width="800" height="220" xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#0D1117" rx="12"/>

    <rect width="100%" height="32" fill="#1a1a2e" rx="12" />
    <rect y="16" width="100%" height="16" fill="#1a1a2e" />
    <circle cx="20" cy="16" r="6" fill="#FF5F56"/>
    <circle cx="40" cy="16" r="6" fill="#FFBD2E"/>
    <circle cx="60" cy="16" r="6" fill="#27C93F"/>
    <text x="85" y="20" fill="#6B7280" font-family="'Fira Code', 'Courier New', monospace" font-size="12">ahmedfawzy@laravel:~/app$</text>

    <g font-family="'Fira Code', 'Courier New', monospace" font-size="14">
        <text x="20" y="60" fill="#10B981">$ php artisan app:scan --mode=bugs</text>

        <text x="20" y="85" fill="#C9D1D9">Scanning controllers, models, services...</text>

        <g>
            <text x="20" y="112" fill="#FF6B6B" font-size="18">🐛</text>
            <text x="100" y="112" fill="#FF6B6B" font-size="18">🐞</text>
            <text x="180" y="112" fill="#FF6B6B" font-size="18">🐛</text>
            <text x="260" y="112" fill="#FF6B6B" font-size="18">🐞</text>
            <text x="340" y="112" fill="#FF6B6B" font-size="18">🐛</text>
            <text x="420" y="112" fill="#FF6B6B" font-size="18">🐞</text>
            <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" />
        </g>

        <g>
            <text x="0" y="112" font-size="18" fill="#FF2D20">⚡</text>
            <animateTransform attributeName="transform" type="translate" from="-30 0" to="800 0" dur="6s" repeatCount="indefinite" />
            <text x="20" y="108" font-size="10" fill="#10B981" font-weight="bold">[FIXED]</text>
        </g>

        <text x="20" y="145" fill="#10B981">✓ Bugs eliminated: 115 | Tests passed: 342</text>
        <text x="20" y="170" fill="#C9D1D9">✓ Routes: 48 | Models: 23 | Migrations: 67</text>
        <text x="20" y="195" fill="#FF2D20" font-size="12">🚀 [DEPLOY READY] All systems optimal. Artisan out.</text>
    </g>
    </svg>